openapi: 3.0.3
info:
  title: Contrack API
  version: 0.1.0-staging
  description: >
    Recurring service contract management.
  contact:
    name: Contrack documentation
    url: https://github.com/
servers:
  - url: /api/v1

tags:
  - name: Auth
  - name: Contracts
  - name: Shifts
  - name: Field
    description: Reached only with a per-shift signed token — no session, no login.
  - name: Statements
  - name: Alerts and dashboard
  - name: Customers
  - name: Employees
  - name: Teams
  - name: Platform
    description: >
      /platform/* only. Authenticated against `platform_admins`, resolved by the same
      Access Control component as every other tag (see `03-architecture.md` §8.1) —
      but carries no `tenant_id` and cannot reach any resource above.

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Exchange credentials for a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: mai.lt@example.com }
                password: { type: string, format: password, example: "•••••••" }
      responses:
        '200':
          description: Credential issued
          content:
            application/json:
              examples:
                manager:
                  value:
                    token: eyJhbGciOiJIUzI1NiJ9.example
                    refresh_token: eyJhbGciOiJIUzI1NiJ9.refresh-example
                    expires_in: 1800
                    employee: { id: 12, tenant_id: 4, name: "Lê Thị Mai", role: manager }
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          description: >
            Unknown email or wrong password — the two are not distinguished —
            or the tenant is suspended
          content:
            application/json:
              examples:
                invalid_credentials: { $ref: '#/components/examples/AuthInvalidCredentials' }
                tenant_suspended: { $ref: '#/components/examples/TenantSuspended' }
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Exchange a single-use refresh token for a new credential pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: >-
            New credential pair. The presented refresh token is single-use: it is invalid
            from here on, together with any credential already issued from it.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Session' } }
        '401':
          description: Refresh token expired, already used, or its employee is no longer active
          content:
            application/json:
              examples:
                credential_expired: { $ref: '#/components/examples/CredentialExpired' }
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Invalidate the current credential, and its refresh token when supplied
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        '204': { description: Logged out }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentEmployee
      summary: Current employee, role and manager chain — drives client-side navigation scoping
      responses:
        '200':
          description: The authenticated employee
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # -------------------------------------------------------------- Platform
  /platform/auth/login:
    post:
      tags: [Platform]
      operationId: platformLogin
      summary: Exchange platform-admin credentials for a platform credential
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: ops.admin }
                password: { type: string, format: password, example: "•••••••" }
      responses:
        '200':
          description: Platform credential issued — carries no tenant_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  platform_admin:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
        '401':
          description: Unknown username or wrong password
          content:
            application/json:
              examples:
                invalid_credentials: { $ref: '#/components/examples/AuthInvalidCredentials' }
              schema: { $ref: '#/components/schemas/Error' }

  /platform/tenants:
    get:
      tags: [Platform]
      operationId: listTenants
      summary: List tenants
      security: [{ platformBearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, suspended] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Tenants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Platform]
      operationId: createTenant
      summary: Create a tenant and its first Director account — FR19
      security: [{ platformBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantCreate' }
      responses:
        '201':
          description: Tenant and its first Director created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400':
          description: Malformed body
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /platform/tenants/{id}:
    patch:
      tags: [Platform]
      operationId: updateTenantStatus
      summary: Suspend or reactivate a tenant — FR20
      security: [{ platformBearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended] }
      responses:
        '200':
          description: Tenant updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '404':
          description: Unknown tenant id
          content:
            application/json:
              examples:
                tenant_not_found: { $ref: '#/components/examples/TenantNotFound' }
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /platform/dashboard:
    get:
      tags: [Platform]
      operationId: getPlatformDashboard
      summary: Platform Admin's landing dashboard — tenant counts, growth trend, recent tenants — FR21
      security: [{ platformBearerAuth: [] }]
      responses:
        '200':
          description: Platform dashboard summary, computed from tenants only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformDashboardSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------- Contracts
  /contracts:
    get:
      tags: [Contracts]
      operationId: listContracts
      summary: List contracts
      x-roles: [director, manager, accountant]
      x-scope: all
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ContractStatus' } }
        - { name: expiring_within_days, in: query, schema: { type: integer, example: 30 } }
        - { name: customer_id, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string }, description: "Free-text match on contract code, customer or site name" }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: A page of contracts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Contracts]
      operationId: createContract
      summary: Create a contract with nested sites and service items — generates its shift schedule
      x-roles: [director, manager]
      x-scope: all
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractCreate' }
            examples:
              keangnam:
                summary: Contract with one site and one service item
                value:
                  customer_id: 7
                  signed_at: "2024-01-15"
                  expires_at: "2024-11-15"
                  sites:
                    - name: "Tòa A — Phạm Hùng, Nam Từ Liêm"
                      work_requirements: "Bảo trì VRV & Chiller theo lịch"
                      items:
                        - { name: "Bảo trì VRV & Chiller", frequency_count: 2, frequency_unit: month, frequency_rule: null, unit_price: 42000000 }
      responses:
        '201':
          description: Contract created; shifts generated for the full term
          headers:
            Location: { schema: { type: string }, example: /api/v1/contracts/89 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contract' }
        '400':
          description: Malformed body, invalid term, or an item invalid — sequence 1's `alt validation failed` branch
          content:
            application/json:
              examples:
                item_invalid: { $ref: '#/components/examples/ContractItemInvalid' }
                term_invalid: { $ref: '#/components/examples/ContractTermInvalid' }
                customer_not_found: { $ref: '#/components/examples/ContractCustomerNotFound' }
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Well-formed and permitted, but not satisfiable
          content:
            application/json:
              examples:
                no_shifts_generated: { $ref: '#/components/examples/ScheduleNoShiftsGenerated' }
              schema: { $ref: '#/components/schemas/Error' }

  /contracts/{id}:
    parameters:
      - { $ref: '#/components/parameters/ContractId' }
    get:
      tags: [Contracts]
      operationId: getContract
      summary: Contract with sites, items, current-period progress and statement history
      x-roles: [director, manager, accountant]
      x-scope: all
      responses:
        '200':
          description: The contract
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Contracts]
      operationId: updateContract
      summary: Update term or status
      x-roles: [director]
      x-scope: all
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_at: { type: string, format: date }
                status: { $ref: '#/components/schemas/ContractStatus' }
      responses:
        '200':
          description: Updated contract
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contract' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Contracts]
      operationId: deleteContract
      summary: Delete — cascades to sites, items, shifts, photos, statements
      x-roles: [director]
      x-scope: all
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /contracts/{id}/sites:
    parameters:
      - { $ref: '#/components/parameters/ContractId' }
    post:
      tags: [Contracts]
      operationId: addSite
      summary: Add a site to a contract
      x-roles: [director, manager]
      x-scope: all
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractSiteCreate' }
      responses:
        '201':
          description: Site added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractSite' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sites/{siteId}:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Contracts]
      operationId: updateSite
      summary: Update a site
      x-roles: [director]
      x-scope: all
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractSiteCreate' }
      responses:
        '200':
          description: Updated site
          content:
            application/json: { schema: { $ref: '#/components/schemas/ContractSite' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Contracts]
      operationId: deleteSite
      summary: Delete a site — cascades to its items and shifts
      x-roles: [director]
      x-scope: all
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sites/{siteId}/items:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Contracts]
      operationId: addServiceItem
      summary: Add a service item to a site
      x-roles: [director, manager]
      x-scope: all
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceItemCreate' }
      responses:
        '201':
          description: Item added
          content:
            application/json: { schema: { $ref: '#/components/schemas/ServiceItem' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /items/{itemId}:
    parameters:
      - { name: itemId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Contracts]
      operationId: updateServiceItem
      summary: Update a service item's frequency or price
      x-roles: [director]
      x-scope: all
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceItemCreate' }
      responses:
        '200':
          description: Updated item
          content:
            application/json: { schema: { $ref: '#/components/schemas/ServiceItem' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Contracts]
      operationId: deleteServiceItem
      summary: Delete a service item — cascades to its shifts
      x-roles: [director]
      x-scope: all
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /contracts/{id}/schedule:regenerate:
    parameters:
      - { $ref: '#/components/parameters/ContractId' }
    post:
      tags: [Contracts]
      operationId: regenerateSchedule
      summary: Regenerate future shifts after an item or term change
      description: >
        Never touches a completed or disputed shift. Regenerates off frequency_count
        + frequency_unit_id (`03-architecture.md` §11 R2, resolved).
      x-roles: [director, manager]
      x-scope: all
      responses:
        '202':
          description: Regeneration queued; body carries the job reference
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Regeneration would move a completed or disputed shift
          content:
            application/json:
              examples:
                regenerate_blocked: { $ref: '#/components/examples/ScheduleRegenerateBlocked' }
              schema: { $ref: '#/components/schemas/Error' }

  # -------------------------------------------------------------- Shifts
  /shifts:
    get:
      tags: [Shifts]
      operationId: listShifts
      summary: >
        List shifts, always scope-filtered. The single endpoint behind four
        screens — "Ca của tôi", "Lịch tổ", "Lịch điều phối" and the manager's
        shift list are the same query at different row scopes.
      x-roles: [director, manager, team_lead, employee]
      x-scope: own/team/unit/all
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ShiftStatus' } }
        - { name: assignee_id, in: query, schema: { type: integer } }
        - { name: contract_id, in: query, schema: { type: integer } }
        - { name: team_id, in: query, schema: { type: integer } }
        - { name: manager_id, in: query, schema: { type: integer } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: A page of shifts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /shifts/{id}:
    parameters:
      - { $ref: '#/components/parameters/ShiftId' }
    get:
      tags: [Shifts]
      operationId: getShift
      summary: Shift with contract, site, item, assignee, evidence and GPS
      x-roles: [director, manager, accountant, team_lead, employee]
      x-scope: own/team/unit/all
      responses:
        '200':
          description: The shift
          content:
            application/json: { schema: { $ref: '#/components/schemas/Shift' } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Shifts]
      operationId: updateShift
      summary: >-
        Reassign or reschedule — rejected on a completed shift, and rejected if a
        manager hasn't assigned the shift to the caller's team yet (`PATCH /shifts/{id}/team`)
      x-roles: [team_lead]
      x-scope: team
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assignee_id: { type: integer }
                scheduled_date: { type: string, format: date }
      responses:
        '200':
          description: Updated shift
          content:
            application/json: { schema: { $ref: '#/components/schemas/Shift' } }
        '403':
          description: Reassigning to an employee outside the caller's team
          content:
            application/json:
              examples:
                assignee_out_of_team: { $ref: '#/components/examples/ShiftAssigneeOutOfTeam' }
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: The shift isn't assigned to the caller's team (or to any team yet)
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '409':
          description: Evidence is write-once — a completed shift rejects reassignment
          content:
            application/json:
              examples:
                already_completed: { $ref: '#/components/examples/ShiftAlreadyCompleted' }
              schema: { $ref: '#/components/schemas/Error' }

  /shifts/{id}/team:
    parameters:
      - { $ref: '#/components/parameters/ShiftId' }
    patch:
      tags: [Shifts]
      operationId: assignShiftTeam
      summary: Assign (or clear) which team owns this shift, ahead of a team lead picking a person
      description: >-
        A shift can exist unassigned to any employee (FR22, D8); this hands it to a team first
        so that team's lead can see it (`GET /shifts`, `x-scope: team`) and reassign it to one
        of their people (`PATCH /shifts/{id}`). No capacity check — nothing stops a manager
        from assigning a team more shifts than it can cover (D27).
      x-roles: [manager, director]
      x-scope: all
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                team_id: { type: integer, nullable: true }
      responses:
        '200':
          description: Updated shift
          content:
            application/json: { schema: { $ref: '#/components/schemas/Shift' } }
        '409':
          description: Evidence is write-once — a completed shift rejects team assignment
          content:
            application/json:
              examples:
                already_completed: { $ref: '#/components/examples/ShiftAlreadyCompleted' }
              schema: { $ref: '#/components/schemas/Error' }

  /shifts/{id}/dispute:
    parameters:
      - { $ref: '#/components/parameters/ShiftId' }
    post:
      tags: [Shifts]
      operationId: disputeShift
      summary: Mark disputed with a reason recorded by staff on the customer's behalf
      x-roles: [manager, director]
      x-scope: unit/all
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, example: "Không thấy nhân viên đến" }
                reported_via: { type: string, enum: [phone, in_person], example: phone }
                reported_by: { type: string, example: "Chị Lan, quản lý toà nhà" }
                reported_at: { type: string, format: date-time }
                description: { type: string }
      responses:
        '200':
          description: Shift marked disputed; excluded from the next statement until resolved
          content:
            application/json: { schema: { $ref: '#/components/schemas/Shift' } }
        '409':
          description: Already disputed
          content:
            application/json:
              examples:
                already_disputed: { $ref: '#/components/examples/ShiftAlreadyDisputed' }
              schema: { $ref: '#/components/schemas/Error' }

  /shifts/{id}/dispute:resolve:
    parameters:
      - { $ref: '#/components/parameters/ShiftId' }
    post:
      tags: [Shifts]
      operationId: resolveDispute
      summary: Evidence upheld — return the shift to completed
      x-roles: [manager, director]
      x-scope: unit/all
      responses:
        '200':
          description: Shift returned to completed
          content:
            application/json: { schema: { $ref: '#/components/schemas/Shift' } }
        '409':
          description: Not currently disputed
          content:
            application/json:
              examples:
                not_disputed: { $ref: '#/components/examples/ShiftNotDisputed' }
              schema: { $ref: '#/components/schemas/Error' }

  /shifts/{id}/link:
    parameters:
      - { $ref: '#/components/parameters/ShiftId' }
    get:
      tags: [Shifts]
      operationId: getFieldLink
      summary: Issue the per-shift field token and its URL
      x-roles: [team_lead, manager, director]
      x-scope: team/unit/all
      responses:
        '200':
          description: The field link
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  url: { type: string, format: uri, example: "https://app.contrack.vn/field/eyJhbGciOi..." }
                  expires_at: { type: string, format: date-time }

  # -------------------------------------------------------------- Field
  /field/context:
    description: >-
      remaining_steps is coarse (all three or none), not per-photo — no per-upload record
      exists to track partial progress (D22), so the API can only tell "not submitted yet"
      from "submitted". The token travels in the `X-Field-Token` header like every other
      field endpoint, never in the URL.
    parameters:
      - { $ref: '#/components/parameters/FieldTokenHeader' }
    get:
      tags: [Field]
      operationId: getFieldContext
      summary: Shift context — site, service item, scheduled time, which evidence steps remain
      security: []
      responses:
        '200':
          description: Field context for this token's shift
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldContext' }
              example:
                contract_site: "Tòa A — Phạm Hùng, Nam Từ Liêm"
                service_item: "Bảo trì VRV & Chiller"
                scheduled_at: "2024-10-21T08:30:00Z"
                remaining_steps: [before_photo, after_photo, receipt_photo]
        '401':
          description: Expired or invalid token
          content:
            application/json:
              examples:
                expired: { $ref: '#/components/examples/TokenExpired' }
                invalid: { $ref: '#/components/examples/TokenInvalid' }
              schema: { $ref: '#/components/schemas/Error' }

  /field/uploads:
    parameters:
      - { $ref: '#/components/parameters/FieldTokenHeader' }
    post:
      tags: [Field]
      operationId: requestUploadTarget
      summary: Request a direct object-storage upload target for one image
      description: >-
        The server signs one PUT under `uploads/{tenant_id}/{shift_id}/` and
        returns it; image bytes never pass through the API. The returned key is
        the only shape `POST /field/submit` accepts for this shift —
        anything else is `upload.key_unknown`.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [content_type]
              properties:
                content_type: { type: string, example: image/jpeg }
      responses:
        '200':
          description: Upload target issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadTarget' }
        '400':
          description: Content type is not an accepted image type
          content:
            application/json:
              examples:
                unsupported_type: { $ref: '#/components/examples/UploadUnsupportedType' }
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing, expired, invalid or already-used field token
          content:
            application/json:
              examples:
                expired: { $ref: '#/components/examples/TokenExpired' }
                invalid: { $ref: '#/components/examples/TokenInvalid' }
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: >-
            Reserved — not returned by the API today. No image body reaches the
            server, so the per-image cap belongs to the bucket's own policy;
            rejecting an oversized upload from the API needs the key recorded
            at issue time (deferred).
          content:
            application/json:
              examples:
                too_large: { $ref: '#/components/examples/UploadTooLarge' }
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too many attempts on one token
          content:
            application/json:
              examples:
                rate_limited: { $ref: '#/components/examples/TokenRateLimited' }
              schema: { $ref: '#/components/schemas/Error' }

  /field/submit:
    parameters:
      - { $ref: '#/components/parameters/FieldTokenHeader' }
    post:
      tags: [Field]
      operationId: submitShift
      summary: >
        Complete the shift. The server stamps captured_at from its own clock,
        inserts shift_photos and writes receipt_photo_url — evidence is
        write-once (`05-architecture.md` §9 D7). latitude/longitude may be
        null; the shift still completes, flagged for missing location.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FieldSubmission' }
            examples:
              with_gps:
                value:
                  photo_keys:
                    before: ["uploads/7/23/before-1.jpg", "uploads/7/23/before-2.jpg"]
                    after: ["uploads/7/23/after-1.jpg"]
                  receipt_photo_key: "uploads/7/23/receipt.jpg"
                  latitude: 21.0176
                  longitude: 105.7833
              no_gps:
                value:
                  photo_keys:
                    before: ["uploads/7/23/before-1.jpg"]
                    after: ["uploads/7/23/after-1.jpg"]
                  receipt_photo_key: "uploads/7/23/receipt.jpg"
                  latitude: null
                  longitude: null
      responses:
        '200':
          description: Shift marked completed
          content:
            application/json: { schema: { $ref: '#/components/schemas/Shift' } }
        '400':
          description: Missing a required photo type, receipt, or citing an unissued upload key
          content:
            application/json:
              examples:
                evidence_incomplete: { $ref: '#/components/examples/ShiftEvidenceIncomplete' }
                key_unknown: { $ref: '#/components/examples/UploadKeyUnknown' }
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing, expired, invalid or already-used field token
          content:
            application/json:
              examples:
                expired: { $ref: '#/components/examples/TokenExpired' }
                invalid: { $ref: '#/components/examples/TokenInvalid' }
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: The token's shift is not the shift being submitted
          content:
            application/json:
              examples:
                shift_mismatch: { $ref: '#/components/examples/TokenShiftMismatch' }
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Re-submitting a completed shift — evidence is write-once
          content:
            application/json:
              examples:
                already_completed: { $ref: '#/components/examples/ShiftAlreadyCompleted' }
              schema: { $ref: '#/components/schemas/Error' }

  # --------------------------------------------------------- Statements
  /statements:
    get:
      tags: [Statements]
      operationId: listStatements
      summary: List statements by period and status
      x-roles: [director, accountant]
      x-scope: all
      parameters:
        - { name: period, in: query, schema: { type: string, format: date }, example: "2024-10-01" }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/StatementStatus' } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: A page of statements
          content:
            application/json: { schema: { $ref: '#/components/schemas/StatementList' } }
    post:
      tags: [Statements]
      operationId: computeStatement
      summary: Compute a draft from a contract's completed shifts × item unit_price
      x-roles: [accountant]
      x-scope: all
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contract_id, period]
              properties:
                contract_id: { type: integer, example: 89 }
                period: { type: string, format: date, example: "2024-10-01" }
      responses:
        '201':
          description: Draft statement created
          content:
            application/json: { schema: { $ref: '#/components/schemas/Statement' } }
        '409':
          description: A shift in the period lacks evidence or is disputed, or a statement already exists
          content:
            application/json:
              examples:
                period_incomplete: { $ref: '#/components/examples/StatementPeriodIncomplete' }
                already_exists: { $ref: '#/components/examples/StatementAlreadyExists' }
              schema: { $ref: '#/components/schemas/Error' }

  /statements/{id}:
    parameters:
      - { $ref: '#/components/parameters/StatementId' }
    get:
      tags: [Statements]
      operationId: getStatement
      summary: Statement with its shift lines and evidence references
      x-roles: [director, accountant]
      x-scope: all
      responses:
        '200':
          description: The statement
          content:
            application/json: { schema: { $ref: '#/components/schemas/Statement' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /statements/{id}/export:
    parameters:
      - { $ref: '#/components/parameters/StatementId' }
    post:
      tags: [Statements]
      operationId: exportStatement
      summary: Render the PDF with photos and receipts embedded; sets status = issued
      x-roles: [accountant]
      x-scope: all
      responses:
        '202':
          description: Rendering queued; body carries the job reference
          content:
            application/json:
              schema:
                type: object
                properties: { job_id: { type: string } }
        '409':
          description: Editing a statement already issued or sent
          content:
            application/json:
              examples:
                immutable: { $ref: '#/components/examples/StatementImmutable' }
              schema: { $ref: '#/components/schemas/Error' }

  /statements/{id}/send:
    parameters:
      - { $ref: '#/components/parameters/StatementId' }
    post:
      tags: [Statements]
      operationId: sendStatement
      summary: Record that the statement was sent to the customer; sets status = sent
      x-roles: [accountant]
      x-scope: all
      responses:
        '200':
          description: Statement marked sent
          content:
            application/json: { schema: { $ref: '#/components/schemas/Statement' } }
        '409':
          description: Sending before export — there is no PDF yet
          content:
            application/json:
              examples:
                not_issued: { $ref: '#/components/examples/StatementNotIssued' }
              schema: { $ref: '#/components/schemas/Error' }

  /reconciliation:
    get:
      tags: [Statements]
      operationId: getReconciliation
      summary: Per contract — shifts due by frequency, shifts with complete evidence, and the variance
      x-roles: [director, accountant]
      x-scope: all
      parameters:
        - { name: period, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Reconciliation rows for the period
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReconciliationRow' }

  # ------------------------------------------------- Contract profitability
  /contracts/{id}/costs:
    get:
      tags: [Statements]
      operationId: listContractCosts
      summary: List recorded costs for a contract, optionally filtered to one month — FR14
      x-roles: [director, accountant]
      x-scope: all
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: period, in: query, schema: { type: string, format: date, example: "2024-10-01" } }
      responses:
        '200':
          description: Recorded cost entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ContractCost' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Statements]
      operationId: upsertContractCost
      summary: Set one month's cost for a category — replaces any existing entry for (category, period) — FR14
      x-roles: [accountant]
      x-scope: all
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, period, amount]
              properties:
                category: { type: string, enum: [labor, materials, other] }
                period: { type: string, format: date, example: "2024-10-01" }
                amount: { type: number }
      responses:
        '200':
          description: Cost entry saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractCost' }
        '400':
          description: Malformed body
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /contracts/{id}/profitability:
    get:
      tags: [Statements]
      operationId: getContractProfitability
      summary: Revenue vs. recorded cost per month, trailing N months — FR4
      x-roles: [director, accountant]
      x-scope: all
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: months, in: query, schema: { type: integer, default: 6 } }
      responses:
        '200':
          description: Monthly profit/loss
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ContractProfitMonth' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------- Alerts / dashboard
  /alerts:
    get:
      tags: [Alerts and dashboard]
      operationId: listAlerts
      summary: Expiring contracts and overdue shifts, with per-alert delivery status
      x-roles: [director, manager, team_lead]
      x-scope: unit/team/all
      responses:
        '200':
          description: A page of alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Alert' }

  /alerts/{id}/send:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Alerts and dashboard]
      operationId: resendAlert
      summary: Re-send through Zalo ZNS or SMS
      x-roles: [director, manager]
      x-scope: unit/all
      responses:
        '202':
          description: Send queued
          content:
            application/json:
              schema:
                type: object
                properties: { job_id: { type: string } }
        '502':
          description: Zalo ZNS and SMS both rejected the send; falls back in-app
          content:
            application/json:
              examples:
                channel_unavailable: { $ref: '#/components/examples/AlertChannelUnavailable' }
              schema: { $ref: '#/components/schemas/Error' }

  /dashboard:
    get:
      tags: [Alerts and dashboard]
      operationId: getDashboard
      summary: Active, expiring and disputed contract counts; projected revenue; trends — FR2
      x-roles: [director]
      x-scope: all
      parameters:
        - name: month
          in: query
          description: Anchor month for the filter, YYYY-MM. Defaults to the current month if none of month/from/to is given. Trend arrays cover the trailing 6 months ending here; renewal_rate_pct and cancellation_rate_pct cover the trailing 12. Mutually exclusive with from/to.
          schema: { type: string, example: "2024-10" }
        - name: from
          in: query
          description: Start of a custom period (date), used with `to` instead of `month`. Snapshot widgets still read "as of now"; trend/rate windows anchor to `to` instead of a calendar month.
          schema: { type: string, format: date, example: "2024-10-01" }
        - name: to
          in: query
          description: End of a custom period (date), used with `from` instead of `month`.
          schema: { type: string, format: date, example: "2024-10-15" }
      responses:
        '200':
