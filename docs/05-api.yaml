components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Session or bearer token issued by POST /auth/login, carrying tenant_id and
        role, carried on every desk request. Field endpoints (/field/*) carry no
        session — the per-shift signed token in the path is their sole credential;
        see `03-architecture.md` §8.1.
    platformBearerAuth:
      type: http
      scheme: bearer
      description: >
        Token issued by POST /platform/auth/login against platform_admins, resolved
        by the same Access Control component as bearerAuth. Carries no tenant_id and
        is rejected by every bearerAuth-secured operation above — the two credential
        spaces stay separate even though one component resolves both; see
        `03-architecture.md` §8.1.

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 25, maximum: 100 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0 }
    ContractId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    ShiftId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    StatementId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    FieldTokenHeader:
      name: X-Field-Token
      in: header
      required: true
      description: >-
        Per-shift signed token — names exactly one shift, expires, and is revoked
        on first use. Carried in a header, never in the URL path, so no server or
        log between the phone and the API ever sees it in a request line.
      schema: { type: string }

  responses:
    Unauthorized:
      description: Missing or expired credential
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    Forbidden:
      description: Authenticated but out of role or out of scope
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    NotFound:
      description: >
        Not found, or found but outside the caller's scope — the two are
        deliberately indistinguishable so a scope boundary never leaks a row's
        existence
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: shift.already_completed }
            message: { type: string, example: "This shift is already completed" }
            details: { type: object }

    Session:
      type: object
      description: >-
        Credential pair issued by POST /auth/login and POST /auth/refresh. `expires_in` is the
        access token's remaining lifetime in seconds. Role and scope are re-read from
        `employees` per request, never trusted from the token.
      properties:
        token: { type: string }
        refresh_token: { type: string, description: Single-use; invalidated by rotation and by POST /auth/logout }
        expires_in: { type: integer, example: 1800 }
        employee:
          type: object
          properties:
            id: { type: integer }
            tenant_id: { type: integer }
            name: { type: string }
            role: { $ref: '#/components/schemas/Role' }

    Role:
      type: string
      enum: [director, accountant, manager, team_lead, employee]

    TenantStatus:
      type: string
      enum: [active, suspended]

    TenantCreate:
      type: object
      required: [name, director_email, director_password]
      properties:
        name: { type: string, example: "Vệ sinh công nghiệp Thành Đạt" }
        director_email: { type: string, format: email, example: director@example.com }
        director_password: { type: string, format: password, example: "•••••••" }
    Tenant:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        status: { $ref: '#/components/schemas/TenantStatus' }
        created_at: { type: string, format: date-time }
        director_employee_id:
          type: integer
          description: id of the Director employee created alongside this tenant
    TenantList:
      allOf:
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Tenant' } }
        - $ref: '#/components/schemas/CollectionMeta'

    ContractStatus:
      type: string
      enum: [active, expired, cancelled, renewed]
      description: >
        Stored status. "Expiring soon" is not a stored value — it's computed at
        read time as active AND expires_at within 30 days (FR25), so the dashboard's
        expiring_soon count never drifts from the same 30-day window the alert uses.
    ShiftStatus:
      type: string
      enum: [scheduled, late, completed, disputed]
    StatementStatus:
      type: string
      enum: [draft, issued, sent]

    CollectionMeta:
      type: object
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    ServiceItemCreate:
      type: object
      required: [name, frequency_count, frequency_unit, unit_price]
      properties:
        name: { type: string, example: "Bảo trì VRV & Chiller" }
        frequency_count:
          type: integer
          minimum: 1
          description: How many occurrences per `frequency_unit` — drives shift generation directly, no parsing involved
          example: 2
        frequency_unit:
          type: string
          enum: [day, week, month, quarter, year]
          example: month
        frequency_rule:
          type: string
          nullable: true
          description: >
            Free text, optional. Staff-facing note of the exact agreement (`03-architecture.md`
            §9 D18). The common cases — a fixed weekday within a weekly frequency, or a fixed
            day-of-month within a monthly/quarterly/yearly frequency — are captured structurally
            by `day_of_week`/`day_of_month` below and honored by the generator directly. This
            field stays free text for whatever a contract negotiates outside that shape; a
            director moves individual shifts by hand to match it when it isn't covered.
          example: "thứ 7 hàng tuần"
        day_of_week:
          type: integer
          nullable: true
          minimum: 0
          maximum: 6
          description: >
            0=Sunday..6=Saturday. Only meaningful with `frequency_unit: week`; the generator
            snaps every occurrence to this weekday instead of stepping `frequency_count` days
            from `signed_at`. Mutually exclusive with `day_of_month`.
          example: 6
        day_of_month:
          type: integer
          nullable: true
          minimum: 1
          maximum: 31
          description: >
            Only meaningful with `frequency_unit: month`, `quarter` or `year`; the generator
            snaps every occurrence to this day-of-month (clamped to the target month's last day
            when it doesn't have that many days). Mutually exclusive with `day_of_week`.
          example: 15
        unit_price: { type: number, example: 42000000 }
    ServiceItem:
      allOf:
        - $ref: '#/components/schemas/ServiceItemCreate'
        - type: object
          properties:
            id: { type: integer }
            site_id: { type: integer }

    ContractSiteCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, example: "Tòa A — Phạm Hùng, Nam Từ Liêm" }
        work_requirements: { type: string }
        notes: { type: string }
        latitude: { type: number, nullable: true, example: 21.0176 }
        longitude: { type: number, nullable: true, example: 105.7833 }
        radius_meters: { type: integer, example: 200, description: "Geofence radius used to verify field submissions against this site; defaults to 200m when omitted." }
        items:
          type: array
          items: { $ref: '#/components/schemas/ServiceItemCreate' }
    ContractSite:
      allOf:
        - $ref: '#/components/schemas/ContractSiteCreate'
        - type: object
          properties:
            id: { type: integer }
            contract_id: { type: integer }
            items:
              type: array
              items: { $ref: '#/components/schemas/ServiceItem' }

    ContractCreate:
      type: object
      required: [customer_id, signed_at, expires_at, sites]
      properties:
        customer_id: { type: integer }
        signed_at: { type: string, format: date }
        expires_at: { type: string, format: date }
        sites:
          type: array
          items: { $ref: '#/components/schemas/ContractSiteCreate' }
    Contract:
      allOf:
        - type: object
          properties:
            id: { type: integer }
            customer_id: { type: integer }
            signed_at: { type: string, format: date }
            expires_at: { type: string, format: date }
            status: { $ref: '#/components/schemas/ContractStatus' }
            created_at: { type: string, format: date-time }
            sites:
              type: array
              items: { $ref: '#/components/schemas/ContractSite' }
    ContractList:
      allOf:
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Contract' } }
        - $ref: '#/components/schemas/CollectionMeta'

    ShiftPhoto:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [before, after] }
        url: { type: string, format: uri }
        captured_at: { type: string, format: date-time }

    Shift:
      type: object
      properties:
        id: { type: integer }
        contract_item_id: { type: integer }
        assignee_id: { type: integer, nullable: true, description: "NULL until dispatch assigns it (FR15) — schedule generation (FR22) creates the shift unassigned" }
        team_id: { type: integer, nullable: true, description: "NULL until a manager assigns the shift to a team (PATCH /shifts/{id}/team, D27) — independent of assignee_id" }
        scheduled_date: { type: string, format: date }
        completed_at: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/ShiftStatus' }
        latitude: { type: number, nullable: true, example: 21.0176 }
        longitude: { type: number, nullable: true, example: 105.7833 }
        geo_verified: { type: boolean, description: "True when the submitted coordinates fell within the site's geofence radius; false when missing or out of range (submission is accepted either way)." }
        captured_at: { type: string, format: date-time, nullable: true }
        receipt_photo_url: { type: string, format: uri, nullable: true }
        dispute_reason: { type: string, nullable: true, description: "Set by POST /shifts/{id}/dispute; kept on the shift after resolution rather than cleared" }
        dispute_reported_via: { type: string, enum: [phone, in_person], nullable: true }
        dispute_reported_by: { type: string, nullable: true }
        dispute_reported_at: { type: string, format: date-time, nullable: true, description: "Defaults to server time when the dispute request omits it" }
        dispute_description: { type: string, nullable: true }
        photos:
          type: array
          items: { $ref: '#/components/schemas/ShiftPhoto' }
    ShiftList:
      allOf:
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Shift' } }
        - $ref: '#/components/schemas/CollectionMeta'

    FieldContext:
      type: object
      properties:
        contract_site: { type: string }
        service_item: { type: string }
        scheduled_at: { type: string, format: date-time }
        remaining_steps:
          type: array
          items: { type: string, enum: [before_photo, after_photo, receipt_photo] }

    UploadTarget:
      type: object
      description: >-
        Where to PUT one image. The key is scoped to the shift that requested it
        — `uploads/{tenant_id}/{shift_id}/{uuid}.{jpg|png|webp}` — and is the
        only key `POST /field/submit` accepts for that shift.
      properties:
        upload_url: { type: string, format: uri }
        key: { type: string, example: "uploads/7/23/after-1.jpg" }

    FieldSubmission:
      type: object
      required: [photo_keys, receipt_photo_key]
      properties:
        photo_keys:
          type: object
          properties:
            before: { type: array, items: { type: string } }
            after: { type: array, items: { type: string } }
        receipt_photo_key: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }

    StatementLine:
      type: object
      properties:
        shift_id: { type: integer }
        scheduled_date: { type: string, format: date }
        has_evidence: { type: boolean }
        amount: { type: number }
    Statement:
      type: object
      properties:
        id: { type: integer }
        contract_id: { type: integer }
        period: { type: string, format: date }
        total_amount: { type: number }
        status: { $ref: '#/components/schemas/StatementStatus' }
        pdf_url: { type: string, format: uri, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/StatementLine' }
    StatementList:
      allOf:
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Statement' } }
        - $ref: '#/components/schemas/CollectionMeta'

    ReconciliationRow:
      type: object
      properties:
        contract_id: { type: integer }
        shifts_due: { type: integer }
        shifts_with_evidence: { type: integer }
        variance: { type: integer }

    Alert:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [contract_expiring, shift_overdue, schedule_overload] }
        subject_id: { type: integer }
        due_in_days: { type: integer, nullable: true }
        overdue_by_days: { type: integer, nullable: true }
        delivery_status: { type: string, enum: [sent, not_sent, fallback] }

    DashboardSummary:
      type: object
      properties:
        active_contracts: { type: integer }
        expiring_soon: { type: integer }
        disputed_shifts: { type: integer }
        projected_revenue: { type: number }
        statements_closed:
          type: object
          properties:
            closed: { type: integer }
            total: { type: integer }
        shifts_summary:
          $ref: '#/components/schemas/ShiftStats'
          description: The filtered period's shift statistics across every site.
        shifts_by_site:
          type: array
          description: The same statistics per site, so a Director sees where failures cluster. Ordered by full_fill_pct ascending — worst first.
          items:
            allOf:
              - type: object
                properties:
                  site_id: { type: integer }
                  site_name: { type: string }
              - $ref: '#/components/schemas/ShiftStats'
        bucket_unit:
          type: string
          enum: [month, week, day]
          description: Bucket size the trend arrays are grouped by — months when the caller passed `month`, derived from the span when the caller passed `from`/`to`. The dashboard labels its axes from this rather than assuming months, so no widget is titled "by month".
        new_contracts_trend:
          type: array
          description: Trailing 6 buckets ending at the filtered period. Counts contracts by `signed_at`.
          items: { $ref: '#/components/schemas/TrendBucket' }
        renewal_rate_pct:
          type: number
          description: renewed / (renewed + expired + cancelled) among contracts whose `expires_at` falls in the trailing 12 months ending at the filtered period.
        cancellation_rate_pct:
          type: number
          description: cancelled / (renewed + expired + cancelled) — same cohort and window as renewal_rate_pct, so the two rates read together against one denominator rather than as two unrelated numbers.
        profit_trend:
          type: array
          description: Trailing 6 buckets ending at the filtered period. cost/profit are never null — FR28 estimates a contract's cost (trailing 3-month average of its own recorded costs, or the tenant's average cost-to-revenue ratio if it has none) until the Accountant records the real figure.
          items:
            allOf:
              - $ref: '#/components/schemas/TrendBucket'
              - type: object
                properties:
                  revenue: { type: number }
                  cost: { type: number }
                  profit: { type: number }
                  margin_pct: { type: number, description: "profit / revenue * 100, precomputed so the revenue and margin charts agree with the API rather than each rounding client-side" }
                  is_estimated: { type: boolean, description: true if any contract's cost in this bucket is FR28's estimate rather than an Accountant-recorded figure }
        comparison:
          type: object
          description: The same-length period immediately before the filtered one — the previous month in month mode, or the equally long window ending the day before `from` in custom mode. Every delta badge on the dashboard reads from here, so a custom range is compared like-for-like instead of against a calendar month.
          properties:
            period_start: { type: string, format: date }
            period_end: { type: string, format: date }
            projected_revenue: { type: number }
            margin_pct: { type: number }
            late_shifts: { type: integer }
            new_contracts: { type: integer }

    ShiftStats:
      type: object
      description: >
        Four mutually exclusive slices of `scheduled`: completed + overdue + disputed +
        not_due. Rates are taken over `due` (= scheduled - not_due) rather than over
        `scheduled`, so completed_pct + overdue_pct + disputed_pct is exactly 100: a
        shift whose date has not arrived can be neither finished nor late, and leaving
        it in the denominator would drag every rate down for no reason.
      properties:
        scheduled: { type: integer, description: Shifts the generated schedule placed inside the period. }
        due: { type: integer, description: scheduled - not_due. The denominator for every *_pct below. }
        not_due: { type: integer, description: Scheduled inside the period but the date has not arrived yet. }
        completed: { type: integer, description: Finished on schedule with no dispute. Shown as "Hoàn thành". }
        completed_pct: { type: number, nullable: true, description: completed / due * 100. Null when due is 0. }
        overdue: { type: integer, description: Its scheduled date has passed and it is still not finished — FR26. Shown as "Trễ hẹn". }
        overdue_pct: { type: number, nullable: true, description: overdue / due * 100. Null when due is 0. }
        disputed: { type: integer, description: Finished but carrying an FR8 dispute. Counted here rather than under completed, so the two never double-count. }
        disputed_pct: { type: number, nullable: true, description: disputed / due * 100. Null when due is 0. }
        missing_evidence: { type: integer, description: Of `completed` — finished and undisputed but short of the required evidence. Reported for follow-up; it does not form a fourth slice. }

    TrendBucket:
      type: object
      properties:
        period_start: { type: string, format: date, example: "2024-10-01" }
        period_end: { type: string, format: date, example: "2024-10-31" }
        label: { type: string, example: "T10", description: Short axis label rendered as-is, so bucket naming stays a server concern rather than being re-derived by each client. }
        count: { type: integer }

    PlatformDashboardSummary:
      type: object
      properties:
        total_tenants: { type: integer }
        active_tenants: { type: integer }
        suspended_tenants: { type: integer }
        tenants_created_this_period: { type: integer }
        growth_trend:
          type: array
          items: { $ref: '#/components/schemas/TrendBucket' }
        recent_tenants:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              status: { type: string, enum: [active, suspended] }
              created_at: { type: string, format: date-time }

    ContractCost:
      type: object
      description: One recorded cost line for a contract in one month — FR14. Unique on (contract, category, period).
      properties:
        id: { type: integer }
        contract_id: { type: integer }
        category: { type: string, enum: [labor, materials, other] }
        period: { type: string, format: date, example: "2024-10-01", description: First day of the month the cost belongs to. }
        amount: { type: number }
        note: { type: string, nullable: true }
        recorded_by: { type: integer, description: Employee id of the Accountant who entered it. }
        recorded_at: { type: string, format: date-time }

    ContractProfitMonth:
      type: object
      description: One month of a contract's profit and loss — FR4. Never blank; FR28 fills an unrecorded month with an estimate and flags it.
      properties:
        period: { type: string, format: date, example: "2024-10-01" }
        revenue: { type: number, description: Derived from contract_items, not stored. }
        cost: { type: number }
        profit: { type: number }
        margin_pct: { type: number }
        is_estimated: { type: boolean, description: true when cost is FR28's estimate rather than an Accountant-recorded figure — the UI marks these "Ước tính". }

    CustomerCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, example: "Keangnam Landmark 72" }
        company_name: { type: string, nullable: true }
        contact: { type: string, example: "Chị Lan · 0912 345 678" }
        address: { type: string }
        segment: { type: string, enum: [regular, vip], default: regular }
    Customer:
      allOf:
        - $ref: '#/components/schemas/CustomerCreate'
        - type: object
          properties:
            id: { type: integer }
            created_at: { type: string, format: date-time }
    CustomerList:
      allOf:
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Customer' } }
        - $ref: '#/components/schemas/CollectionMeta'

    EmployeeCreate:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string, example: "Nguyễn Văn Toàn" }
        contact: { type: string }
        email: { type: string, format: email, example: toan.nv@example.com }
        password:
          type: string
          format: password
          description: >-
            Optional. When omitted the account's initial password is its own `email`;
            send it on PATCH to reset the password. No invite-email flow in the MVP.
        role: { $ref: '#/components/schemas/Role' }
        manager_id: { type: integer, nullable: true }
        team_id: { type: integer, nullable: true, description: "NULL for desk staff — not every employee belongs to a team" }
        status:
          type: string
          enum: [active, terminated]
          description: >-
            Optional on PATCH — reactivates a terminated account, or terminates one
            without the DELETE endpoint's future-shift guard. Ignored on POST; a
            created account is always active.
    Employee:
      allOf:
        - $ref: '#/components/schemas/EmployeeCreate'
        - type: object
          properties:
            id: { type: integer }
    EmployeeList:
      allOf:
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Employee' } }
        - $ref: '#/components/schemas/CollectionMeta'

    Team:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: "Tổ 1 — HVAC" }
        code: { type: string, example: T1 }
        lead: { type: string, nullable: true, description: Derived — the member holding the team-lead role }
        member_count: { type: integer }

  examples:
    AuthInvalidCredentials:
      value: { error: { code: auth.invalid_credentials, message: "Wrong username or password", details: {} } }
    TenantSuspended:
      value: { error: { code: tenant.suspended, message: "This company's account has been suspended", details: {} } }
    CredentialExpired:
      value: { error: { code: auth.credential_expired, message: "Your session has expired", details: {} } }
    TenantNotFound:
      value: { error: { code: tenant.not_found, message: "Company not found", details: { tenant_id: 999 } } }
    TokenExpired:
      value: { error: { code: token.expired, message: "This link has expired", details: { expired_at: "2024-10-21T20:00:00Z" } } }
    TokenInvalid:
      value: { error: { code: token.invalid, message: "This link is invalid", details: {} } }
    TokenShiftMismatch:
      value: { error: { code: token.shift_mismatch, message: "This link doesn't match this shift", details: {} } }
    TokenRateLimited:
      value: { error: { code: token.rate_limited, message: "Try again in a few minutes", details: { retry_after_seconds: 60 } } }
    ContractItemInvalid:
      value: { error: { code: contract.item_invalid, message: "An item is missing its frequency or has an invalid unit price", details: { items: [{ index: 0, field: frequency_count }] } } }
    ContractTermInvalid:
      value: { error: { code: contract.term_invalid, message: "Expiry date must be after the signing date", details: { signed_at: "2024-01-15", expires_at: "2024-01-01" } } }
    ContractCustomerNotFound:
      value: { error: { code: contract.customer_not_found, message: "Customer not found", details: { customer_id: 999 } } }
    ScheduleNoShiftsGenerated:
      value: { error: { code: schedule.no_shifts_generated, message: "No shifts could be generated within the contract's term", details: { item_id: 4 } } }
    ScheduleRegenerateBlocked:
      value: { error: { code: schedule.regenerate_blocked, message: "A shift is already completed or under dispute", details: { shift_ids: [22, 23] } } }
    ShiftAlreadyCompleted:
      value: { error: { code: shift.already_completed, message: "This shift is already completed", details: { completed_at: "2024-10-14T10:41:00Z" } } }
    ShiftEvidenceIncomplete:
      value: { error: { code: shift.evidence_incomplete, message: "Missing photos or receipt", details: { missing: [after_photo] } } }
    ShiftAssigneeOutOfTeam:
      value: { error: { code: shift.assignee_out_of_team, message: "This employee is not on your team", details: { assignee_id: 31 } } }
    ShiftNotDisputed:
      value: { error: { code: shift.not_disputed, message: "This shift is not under dispute", details: { status: completed } } }
    ShiftAlreadyDisputed:
      value: { error: { code: shift.already_disputed, message: "This shift is already under dispute", details: { disputed_at: "2024-10-15T09:20:00Z" } } }
    UploadTooLarge:
      value: { error: { code: upload.too_large, message: "Photo exceeds the allowed size", details: { limit_bytes: 5242880, actual_bytes: 8123456 } } }
    UploadUnsupportedType:
      value: { error: { code: upload.unsupported_type, message: "Photo format is not supported", details: { content_type: image/heic } } }
    UploadKeyUnknown:
      value: { error: { code: upload.key_unknown, message: "No photo was uploaded for this shift", details: { keys: ["uploads/x/y.jpg"] } } }
    StatementPeriodIncomplete:
      value: { error: { code: statement.period_incomplete, message: "A shift still lacks evidence or is under dispute", details: { shift_ids: [23] } } }
    StatementAlreadyExists:
      value: { error: { code: statement.already_exists, message: "A statement for this period already exists", details: { statement_id: 15 } } }
    StatementNotIssued:
      value: { error: { code: statement.not_issued, message: "PDF has not been exported yet", details: { status: draft } } }
    StatementImmutable:
      value: { error: { code: statement.immutable, message: "This statement is closed and can no longer be edited", details: { status: issued } } }
    AlertChannelUnavailable:
      value: { error: { code: alert.channel_unavailable, message: "Couldn't send via Zalo/SMS — switched to an in-app reminder", details: { channel: zalo_zns, provider_code: "ERR_TEMPLATE" } } }
    CustomerHasActiveContracts:
      value: { error: { code: customer.has_active_contracts, message: "This customer still has running contracts", details: { contract_ids: [89] } } }
    EmployeeHasAssignedShifts:
      value: { error: { code: employee.has_assigned_shifts, message: "This employee still has upcoming shifts", details: { shift_ids: [40, 41] } } }
    EmployeeEmailTaken:
      value: { error: { code: employee.email_taken, message: "Email is already in use", details: { email: toan.nv@example.com } } }
    EmployeeManagerCycle:
