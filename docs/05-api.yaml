          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }
              example:
                active_contracts: 48
                expiring_soon: 5
                disputed_shifts: 3
                projected_revenue: 245000000
                shifts_with_evidence_pct: 94
                statements_closed: { closed: 41, total: 48 }
                bucket_unit: month
                comparison:
                  period_start: "2024-09-01"
                  period_end: "2024-09-30"
                  projected_revenue: 240000000
