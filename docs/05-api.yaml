    TeamCodeTaken:
      value: { error: { code: team.code_taken, message: "Team code is already in use", details: { code: T1 } } }
    TeamHasMembers:
      value: { error: { code: team.has_members, message: "This team still has members", details: { employee_ids: [31, 40] } } }
    TeamLeadConflict:
      value: { error: { code: team.lead_conflict, message: "This team already has a lead", details: { employee_id: 31 } } }
    ForbiddenRole:
      value: { error: { code: auth.forbidden_role, message: "Your role isn't permitted to do this", details: { required_role: director } } }
    OutOfScope:
      value: { error: { code: auth.out_of_scope, message: "Data not found", details: {} } }
    ValidationFailed:
      value: { error: { code: validation.failed, message: "Invalid data", details: { fields: [{ field: name, message: "name must be a string" }] } } }
