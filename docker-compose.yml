services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: contrack
      POSTGRES_PASSWORD: contrack
      POSTGRES_DB: contrack
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U contrack -d contrack']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JWT_SECRET: change-me-in-every-environment
      JWT_ACCESS_TTL_SECONDS: '1800'
      JWT_REFRESH_TTL_SECONDS: '43200'
      BCRYPT_ROUNDS: '10'
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: contrack
      DB_USER: contrack
      DB_PASSWORD: contrack
      DB_SSL: 'false'
      PORT: '3000'
      # Field photo uploads stay unavailable (storage.unavailable, 503) until a bucket is
      # configured — set S3_BUCKET/S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY and nothing else
      # changes. See backend/.env.example for an S3-compatible endpoint (MinIO, R2, B2).
      S3_BUCKET: ''
      S3_ACCESS_KEY_ID: ''
      S3_SECRET_ACCESS_KEY: ''
      S3_ENDPOINT: ''
      S3_REGION: 'ap-southeast-1'
      S3_FORCE_PATH_STYLE: 'false'
    ports:
      - '3000:3000'
    command: sh -c "npm run migration:run && node dist/main.js"

volumes:
  postgres-data:
